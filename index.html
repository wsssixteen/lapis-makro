<style>
/* Base reset (the Claude preview adds this on its own) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}

[hidden]{display:none!important}
</style>
<style>
:root{
  /* Layout: phone = one column with a slim sticky layer bar on top (shrinks on scroll, opens into the full
     layer stack) and Back/Next fixed at the bottom. From 860px: sticky stack on the left, layer on the right.
     Light = kek lapis biasa (butter layers, caramel lines). Dark = kek lapis coklat. Each step keeps its own
     bright layer colour, like a kek lapis Sarawak. */
  --bg:#FBF3DD;
  --surface:#FFFDF7;
  --ink:#2E1B10;
  --muted:#6B5240;
  --line:#EBDCB9;
  --accent:#6A3A1C; --on-accent:#FFF7E6; --accent-soft:#F6E3BE;
  --cake-a:#F2C14E; --cake-b:#6A3A1C;
  --l1:#2A7A4B; --on-l1:#FFFFFF; --l1-soft:#E2EFD8;
  --l2:#E3A72F; --on-l2:#2A1709; --l2-soft:#FBE7B5;
  --l3:#3F5FC4; --on-l3:#FFFFFF; --l3-soft:#E5E8F8;
  --l4:#C93D63; --on-l4:#FFFFFF; --l4-soft:#FADFE3;
  --protein:#D6456B; --on-protein:#FFFFFF;
  --fat:#3F5FC4; --on-fat:#FFFFFF;
  --carb:#B8800F; --on-carb:#1F1405;
  --plate:#FFFDF7; --plate-edge:#E6D3AC; --plate-well:#FBF3DF; --utensil:#B7A07F;
  --warn:#9A4512; --warn-soft:#FCE4CE;
  --shadow:rgba(46,27,16,.16);
  --f-display:"Libre Franklin","Franklin Gothic Medium","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
/* Dark = kek lapis coklat */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A0F0A; --surface:#26170F; --ink:#F7EAD5; --muted:#C9AF93; --line:#432C1F;
    --accent:#F2C14E; --on-accent:#2A170C; --accent-soft:#3D2716;
    --cake-a:#F2C14E; --cake-b:#8A5530;
    --l1:#6FCB92; --on-l1:#1A0F0A; --l1-soft:#22331F;
    --l2:#F2C14E; --on-l2:#1A0F0A; --l2-soft:#3D2C12;
    --l3:#93A9F6; --on-l3:#1A0F0A; --l3-soft:#262947;
    --l4:#F27C98; --on-l4:#1A0F0A; --l4-soft:#401C25;
    --protein:#D9567A; --on-protein:#160A06; --fat:#6C86E8; --on-fat:#160A06; --carb:#BB8723; --on-carb:#160A06;
    --plate:#2E1D13; --plate-edge:#4A3122; --plate-well:#24160E; --utensil:#7A6150;
    --warn:#F3A76F; --warn-soft:#3E2414; --shadow:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A0F0A; --surface:#26170F; --ink:#F7EAD5; --muted:#C9AF93; --line:#432C1F;
  --accent:#F2C14E; --on-accent:#2A170C; --accent-soft:#3D2716;
  --cake-a:#F2C14E; --cake-b:#8A5530;
  --l1:#6FCB92; --on-l1:#1A0F0A; --l1-soft:#22331F;
  --l2:#F2C14E; --on-l2:#1A0F0A; --l2-soft:#3D2C12;
  --l3:#93A9F6; --on-l3:#1A0F0A; --l3-soft:#262947;
  --l4:#F27C98; --on-l4:#1A0F0A; --l4-soft:#401C25;
  --protein:#D9567A; --on-protein:#160A06; --fat:#6C86E8; --on-fat:#160A06; --carb:#BB8723; --on-carb:#160A06;
  --plate:#2E1D13; --plate-edge:#4A3122; --plate-well:#24160E; --utensil:#7A6150;
  --warn:#F3A76F; --warn-soft:#3E2414; --shadow:rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.app{max-width:1060px;margin:0 auto;padding-inline:16px;padding-block:8px 48px}
@media (min-width:600px){.app{padding-inline:24px}}
/* Header */
.top{padding-block:8px 14px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{flex:1 1 auto;display:flex;align-items:center;gap:10px;min-width:0}
.mascot{display:block;flex:none;color:var(--ink)}
.mark-m{width:40px;height:40px;margin:-4px -2px -4px -4px}
body::before{content:"";display:block;height:12px;background:repeating-linear-gradient(180deg,var(--cake-a) 0 4px,var(--cake-b) 4px 6px)}
.name{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:900 1.3rem/1.1 var(--f-display);letter-spacing:-.01em}
.tag{margin:8px 0 0;font-size:.875rem;line-height:1.35;color:var(--muted)}
.tools{flex:none;display:flex;align-items:center;gap:8px}
.lang{display:inline-flex;gap:2px;padding:3px;border:2px solid var(--ink);border-radius:999px;background:var(--surface)}
.lang button{min-height:40px;border:0;background:transparent;border-radius:999px;padding:0 12px;font:800 .8125rem/1 var(--f-display);letter-spacing:.08em;cursor:pointer;color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.theme-btn{display:grid;place-items:center;width:44px;height:44px;border:2px solid var(--ink);border-radius:50%;background:var(--surface);color:var(--ink);cursor:pointer}
.theme-btn svg{width:20px;height:20px}
.theme-btn .i-sun{display:none}
.theme-btn[data-mode="dark"] .i-sun{display:block}
.theme-btn[data-mode="dark"] .i-moon{display:none}
@media (max-width:420px){
  .mark-m{width:34px;height:34px}
  .name{font-size:1.15rem}
  .tools{gap:6px}
  .lang button{padding:0 9px}
  .theme-btn{width:42px;height:42px}
}
@media (max-width:380px){.name{font-size:1.05rem}.brand{gap:6px}.mark-m{width:30px;height:30px;margin-right:-3px}}

/* Layout */
.layout{display:grid;gap:24px}
@media (min-width:860px){
  .layout{grid-template-columns:290px minmax(0,1fr);gap:44px;align-items:start}
  .progress{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
  .progress .pbar{display:none}
}

/* Phone layer bar */
.pbar{display:flex;width:100%;min-height:44px;align-items:center;gap:12px;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer}
.psegs{flex:none;display:flex;gap:4px}
.psegs i{display:block;width:26px;height:16px;border-radius:4px;border:1.5px solid var(--line);background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line) 4px 5.5px),var(--surface);transition:height .2s ease}
.psegs i.on{border-color:transparent}
.psegs i.on:nth-child(1){background:var(--l1)}
.psegs i.on:nth-child(2){background:var(--l2)}
.psegs i.on:nth-child(3){background:var(--l3)}
.psegs i.on:nth-child(4){background:var(--l4)}
.psegs i.cur{outline:2px solid var(--ink);outline-offset:1px}
.psegs i{transform-origin:50% 100%}
.psegs i.fresh{animation:segDrop .62s cubic-bezier(.3,.7,.3,1)}
@keyframes segDrop{0%{transform:translateY(-12px);opacity:0}55%{transform:translateY(0) scale(1.14,.7);opacity:1}78%{transform:scale(.96,1.08)}100%{transform:none}}
.ptext{flex:1;min-width:0;font-size:.9375rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptext b{margin-right:6px;white-space:nowrap;font:800 .75rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.pchev{flex:none;display:grid;place-items:center;transition:transform .2s ease}
.pchev svg{width:18px;height:18px}

@media (max-width:859px){
  .layout{display:block}
  .progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:8px 16px;background:var(--bg);border-bottom:1px solid transparent;transition:padding .2s ease,box-shadow .2s ease}
  .progress.stuck{padding-block:5px;border-bottom-color:var(--line);box-shadow:0 6px 16px var(--shadow)}
  .progress.stuck .pbar{padding-block:4px}
  .progress.stuck .psegs i{height:9px}
  .layers{display:none;position:absolute;left:16px;right:16px;top:calc(100% + 4px);max-height:70vh;overflow:auto;padding:14px;border:2px solid var(--ink);border-radius:14px;background:var(--surface);box-shadow:0 16px 32px var(--shadow)}
  .progress.open .layers{display:block}
  .progress.open .pchev{transform:rotate(180deg)}
  main{margin-top:16px}
  .app{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:600px) and (max-width:859px){.progress{margin-inline:-24px;padding-inline:24px}}
@media (max-width:420px){.psegs i{width:18px}.pw{display:none}.pbar{gap:10px}}

/* Kuih lapis stack, layer 1 at the bottom */
.stack-title{margin:0;font:800 .75rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.stack-sub{margin:5px 0 10px;font-size:.8125rem;line-height:1.35;color:var(--muted)}
.stack{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--surface)}
.stack li:not(:first-child){border-bottom:1.5px solid var(--ink)}
.band{display:grid;grid-template-columns:auto minmax(5.2em,1fr) auto;align-items:center;gap:10px;width:100%;min-height:50px;padding:10px 12px;border:0;border-radius:0;text-align:left;cursor:pointer;
  background:repeating-linear-gradient(135deg,transparent 0 7px,var(--line) 7px 8.5px),var(--surface);color:var(--muted);transition:background-color .35s ease,color .35s ease}
.band:disabled{cursor:default}
.stack li:nth-child(1) .band.on{background:var(--l1);color:var(--on-l1)}
.stack li:nth-child(2) .band.on{background:var(--l2);color:var(--on-l2)}
.stack li:nth-child(3) .band.on{background:var(--l3);color:var(--on-l3)}
.stack li:nth-child(4) .band.on{background:var(--l4);color:var(--on-l4)}
.band[aria-current="step"]{box-shadow:inset 0 0 0 3px var(--ink)}
.band.on:not(:disabled):hover .bname{text-decoration:underline;text-underline-offset:3px}
.bn{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;font:800 .75rem/1 var(--f-display)}
.bname{min-width:0;font-weight:700}
.bval{font:800 .875rem/1.2 var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.band:not(.on) .bval{font:italic 400 .8125rem/1.25 var(--f-body)}
.band{transform-origin:50% 100%}
.band.fresh,.to-label.fresh{animation:bandDrop .66s cubic-bezier(.3,.7,.3,1)}
@keyframes bandDrop{0%{transform:translateY(-16px);opacity:0}55%{transform:translateY(0) scaleY(.88);opacity:1}78%{transform:scaleY(1.04)}100%{transform:none}}
.to-label{margin-top:12px;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--surface);color:var(--ink);font:800 .9375rem/1.2 var(--f-display);cursor:pointer}
.to-label[aria-current="page"]{background:var(--ink);color:var(--bg)}
.local{margin:10px 0 0;font-size:.75rem;color:var(--muted)}

/* Steps: each layer carries its own kuih colour */
#s1,#s5{--lc:var(--l1);--on-lc:var(--on-l1);--lc-soft:var(--l1-soft)}
#s2{--lc:var(--l2);--on-lc:var(--on-l2);--lc-soft:var(--l2-soft)}
#s3{--lc:var(--l3);--on-lc:var(--on-l3);--lc-soft:var(--l3-soft)}
#s4{--lc:var(--l4);--on-lc:var(--on-l4);--lc-soft:var(--l4-soft)}
.step{min-width:0;max-width:680px}
.eyebrow{display:inline-block;margin:0;padding:6px 10px;border-radius:6px;background:var(--lc);color:var(--on-lc);font:800 .75rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.step h1{margin:10px 0 6px;font:800 clamp(1.65rem,1.2rem + 2vw,2.25rem)/1.08 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.step h1:focus{outline:none}
.sub{margin:0 0 14px;max-width:58ch;color:var(--muted)}
.example{display:inline-block;margin:0 0 14px;padding:5px 11px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:.8125rem;font-weight:700}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;margin:0 0 18px}
.fields .wide{grid-column:1/-1}
@media (max-width:599px){.fields .f-sex,.fields .f-weight{grid-column:1/-1}}
@media (max-width:339px){.fields{grid-template-columns:minmax(0,1fr)}}
fieldset.field{border:0;margin:0;padding:0;min-width:0}
.field{min-width:0}
.flabel{display:block;margin:0 0 6px;padding:0;font-size:.9375rem;font-weight:700}
.goal-field{max-width:280px}

.num{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;height:50px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.num:focus-within{border-color:var(--accent)}
.num button{border:0;background:var(--accent-soft);color:var(--ink);font:700 1.3rem/1 var(--f-display);cursor:pointer}
.num button:active{filter:brightness(.95)}
.mid{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0}
.mid input{flex:none;width:4.4ch;min-width:0;padding:0;border:0;background:transparent;text-align:center;font:800 1.25rem/1 var(--f-display);font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
#age{width:2.8ch}
#height{width:3.8ch}
.mid input:focus{outline:none}
.mid input::-webkit-outer-spin-button,.mid input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{font-size:.8125rem;color:var(--muted)}
.lu{display:none;font-weight:400;color:var(--muted)}
@media (max-width:480px){.lu{display:inline}.num .unit{display:none}}
.err{margin:5px 0 0;font-size:.8125rem;font-weight:700;color:var(--warn)}
.goal-hint{margin:6px 0 0;font-size:.8125rem;color:var(--muted)}

.chips{position:relative;display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:8px}
@media (min-width:600px){.chips.c4{--cols:4}}
.chips input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.chips label{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;min-height:52px;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;line-height:1.25;cursor:pointer;transition:border-color .15s ease,background-color .15s ease}
.chips label small{font-size:.8125rem;font-weight:400;color:var(--muted)}
.chips label{overflow-wrap:break-word}
@media (max-width:420px){.chips label{padding:8px 9px;font-size:.9375rem}}
.chips label:hover{border-color:var(--muted)}
.chips input:checked+label{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.chips input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}

/* Reward card, styled after a food label, capped with the layer's colour */
.reward{background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:22px 16px 16px;box-shadow:inset 0 10px 0 var(--lc)}
.r-label{margin:0;font-size:.9375rem;font-weight:700;line-height:1.3;color:var(--muted)}
.big{margin:2px 0 0;padding-bottom:8px;border-bottom:8px solid var(--ink);font:900 clamp(2.9rem,2rem + 5vw,4.25rem)/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big .u{font:700 1rem/1 var(--f-body);letter-spacing:0;color:var(--muted)}
.note{margin:8px 0 0;font-size:.875rem;color:var(--muted)}
.rows{margin:10px 0 0}
.rows div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.rows div:first-child{border-top:0}
.rows dt{min-width:0;color:var(--muted)}
.rows dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.alert{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:.875rem;font-weight:700}
.tip{margin:12px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.9375rem}
.insight{display:grid;grid-template-columns:42px minmax(0,1fr);column-gap:12px;align-items:start;margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--lc-soft)}
.insight .mascot{grid-row:1 / span 2;width:42px;height:42px}
.insight > p{grid-column:2}
.i-label{display:flex;align-items:center;gap:8px;margin:0 0 4px;font:800 .75rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.insight p:last-child{margin:0}
.fine{margin:10px 0 0;font-size:.75rem;color:var(--muted)}

/* Plate */
.plate-block{display:grid;gap:10px;margin-top:8px;padding-top:12px;border-top:8px solid var(--ink)}
@media (min-width:540px){.plate-block{grid-template-columns:minmax(0,270px) minmax(0,1fr);align-items:center;gap:20px}}
.plate{display:block;width:100%;max-width:300px;height:auto;margin-inline:auto}
.pl-rim{fill:var(--plate);stroke:var(--plate-edge);stroke-width:2}
.pl-well{fill:var(--plate-well)}
.utensil{fill:var(--utensil)}
.w{stroke:var(--plate);stroke-width:2.5;stroke-linejoin:round}
.w-p{fill:var(--protein)}
.w-f{fill:var(--fat)}
.w-c{fill:var(--carb)}
.wl{font:800 17px var(--f-display);text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
.wl-p{fill:var(--on-protein)}
.wl-f{fill:var(--on-fat)}
.wl-c{fill:var(--on-carb)}
.mrows{margin:0}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow dt{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700}
.mrow dd{margin:0;white-space:nowrap;font-variant-numeric:tabular-nums}
.mrow b{font:800 1.125rem/1 var(--f-display)}
.pct{margin-left:6px;font-size:.875rem;color:var(--muted)}
.dot{flex:none;display:inline-block;width:12px;height:12px;border-radius:3px}
.d-p{background:var(--protein)}
.d-f{background:var(--fat)}
.d-c{background:var(--carb)}
.eq{list-style:none;display:grid;gap:8px;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--line)}
.eq li{display:flex;align-items:baseline;gap:10px;font-size:.9375rem}

/* Actions */
.next-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:20px}
.next{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:0 22px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font:800 1rem/1.1 var(--f-display);cursor:pointer;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
@media (hover:hover){.next:hover{transform:translateY(-1px)}}
.next:active{transform:scale(.96);transition-duration:.06s}
.next:disabled{opacity:.6;cursor:progress}
.hint{font-size:.875rem;color:var(--muted)}
.back{min-height:48px;padding:0 6px;border:0;background:transparent;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media (max-width:859px){
  .next-row{position:fixed;left:0;right:0;bottom:0;z-index:25;flex-wrap:nowrap;margin:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 20px var(--shadow)}
  .next-row .hint{display:none}
  .next-row .next{flex:1 1 auto;justify-content:center;min-width:0}
}

.status{min-height:1.5em;margin:10px 0 0;font-size:.9375rem;font-weight:700}
.status.warn{color:var(--warn)}
.label-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink);font:800 .9375rem/1 var(--f-display);cursor:pointer}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;padding:12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:700}

/* HTML label, shown only if the image can't be drawn */
.np{max-width:400px;margin-top:4px;padding:10px 12px 12px;border:3px solid var(--ink);background:var(--surface)}
.np-head{margin:0;font:900 1.75rem/1 var(--f-display);letter-spacing:-.02em;text-transform:uppercase}
.np-head span{display:block;margin-top:3px;font-size:1rem;font-weight:800;letter-spacing:0;text-transform:none}
.np-rule{height:1px;margin:6px 0;background:var(--ink)}
.np-rule.thick{height:10px}
.np-energy{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.np-energy span{font:800 1rem/1.2 var(--f-display)}
.np-energy b{font:900 2rem/1 var(--f-display);white-space:nowrap}
.np-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0;border-top:1px solid var(--ink);font:500 .9375rem/1.3 var(--f-display)}
.np-rule + .np-row{border-top:0}
.np-row b{font-weight:800;text-align:right;white-space:nowrap}

.foot{max-width:70ch;margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:.8125rem;color:var(--muted)}
.foot p{margin:0 0 6px}


/* Final page: the person's own kek lapis, then their portions */
.cake-stage{margin:4px 0 0;max-width:420px}
.platter{display:grid;place-items:center;aspect-ratio:1/1;padding:9%;border-radius:28px;background:var(--plate);border:2px solid var(--plate-edge);box-shadow:0 12px 28px var(--shadow)}
.platter{position:relative}
.slice{position:relative;width:100%;aspect-ratio:1/1;transform:rotate(-2.5deg);filter:drop-shadow(5px 9px 0 rgba(46,27,16,.2))}
.slice canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
.oven{position:absolute;inset:9%;display:grid}
.oven-stack{display:flex;flex-direction:column-reverse;overflow:hidden;border:2px dashed var(--plate-edge);border-radius:4px;transform:rotate(-2.5deg)}
.oven-stack i{display:block;flex:1 1 0;opacity:0}
.oven.run .oven-stack i{animation:layerIn .34s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes layerIn{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
.cheer{position:absolute;right:-14px;top:-24px;width:60px;height:60px;pointer-events:none}
.cheer.hide{visibility:hidden}
.cake-cap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-top:12px}
.cake-cap b{font:800 1.125rem/1.25 var(--f-display)}
.cake-cap span{font:700 .875rem/1.2 var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cake-tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:420px;margin-top:12px}
.tool{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:2px;border:0;border-radius:12px;background:transparent;color:var(--ink);font:800 .8125rem/1.15 var(--f-display);text-align:center;cursor:pointer}
.tool i{display:grid;place-items:center;width:50px;height:50px;border:2px solid var(--ink);border-radius:50%;background:var(--surface);transition:background-color .15s ease,color .15s ease,transform .3s cubic-bezier(.3,1.6,.5,1)}
.tool svg{width:22px;height:22px}
.tool span{max-width:100%;overflow-wrap:anywhere}
.tool[aria-expanded="true"] i{background:var(--ink);color:var(--bg)}
@media (hover:hover){.tool:hover i{background:var(--accent-soft)}.tool[aria-expanded="true"]:hover i{background:var(--ink)}.opt:hover{border-color:var(--line)}.opt[aria-pressed="true"]:hover{border-color:var(--accent)}}
.chooser{max-width:680px;margin-top:10px}
.strip{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;margin-inline:-16px;padding:4px 16px 10px;scrollbar-width:thin}
@media (min-width:600px){.strip{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}}
.opt{flex:none;scroll-snap-align:start;display:grid;justify-items:center;align-content:start;gap:6px;width:86px;padding:7px 4px 8px;border:2px solid transparent;border-radius:14px;background:transparent;color:var(--ink);font:700 .75rem/1.15 var(--f-body);text-align:center;cursor:pointer}
.opt canvas{display:block;width:68px;height:68px;border-radius:4px;box-shadow:2px 3px 0 var(--shadow)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
#r5{margin-top:22px}
.portions{list-style:none;margin:8px 0 0;padding:0}
.portions li{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.portions li:first-child{border-top:0}
.portions svg{display:block;width:44px;height:44px}
.portions .i-p{color:var(--protein)}
.portions .i-c{color:var(--carb)}
.portions .i-f{color:var(--fat)}
.portions b{display:block;font:800 1.25rem/1.2 var(--f-display)}
.portions small{display:block;margin-top:2px;font-size:.875rem;color:var(--muted)}
.day{margin-top:10px;padding-top:12px;border-top:8px solid var(--ink)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0}
.day-h span{font-weight:700;color:var(--muted)}
.day-h b{font:900 1.5rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.mbar{display:flex;gap:3px;height:14px;margin:12px 0 10px;border-radius:7px;overflow:hidden}
.mbar i{display:block;min-width:4px}
.mbar .d-p,.mleg .d-p{background:var(--protein)}
.mbar .d-f,.mleg .d-f{background:var(--fat)}
.mbar .d-c,.mleg .d-c{background:var(--carb)}
.mleg{list-style:none;display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;padding:0;font-size:.9375rem}
.mleg li{display:flex;align-items:center;gap:6px}
.mleg b{font-variant-numeric:tabular-nums}
.preview{display:grid;grid-template-columns:88px minmax(0,1fr);align-items:center;gap:14px;max-width:520px;margin-top:18px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.preview img{display:block;width:88px;height:auto;border:1.5px solid var(--line);border-radius:6px;background:#FCF5E1}
.pv-btn{min-height:44px;margin-top:2px;padding:0;border:0;background:transparent;color:var(--ink);font:800 .875rem/1.2 var(--f-display);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.preview.open{grid-template-columns:minmax(0,1fr)}
.preview.open img{width:100%;max-width:440px}
.pv-h{margin:0;font:800 .9375rem/1.25 var(--f-display)}
.pv-s{margin:3px 0 0;font-size:.8125rem;line-height:1.35;color:var(--muted)}


/* ---------- Motion. All of it switches off for people who ask their device for less motion. ---------- */
.step{position:relative}
@media (prefers-reduced-motion: no-preference){
  /* 1. Slice: a knife in the layer's colour sweeps across and reveals the new layer */
  .step.enter::after{content:"";position:absolute;z-index:3;top:-14px;bottom:-14px;left:-10px;right:-10px;background:var(--bg);border-left:3px solid var(--lc);pointer-events:none;animation:knife .5s cubic-bezier(.65,0,.35,1) forwards}
  .step.enter.rev::after{border-left:0;border-right:3px solid var(--lc);animation-name:knifeRev}
  .step.enter > :not(.next-row){animation:shiftIn .5s cubic-bezier(.2,.8,.2,1) both}
  .step.enter.rev > :not(.next-row){animation-name:shiftInRev}
  /* 3. Press: buttons dip and spring back */
  .btn,.num button,.theme-btn,.lang button,.pbar,.opt{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
  .btn:active,.num button:active,.theme-btn:active,.lang button:active,.pbar:active,.opt:active{transform:scale(.95);transition-duration:.06s}
  .tool:active i{transform:scale(.9);transition-duration:.06s}
  .chips label{transition:border-color .15s ease,background-color .15s ease,transform .3s cubic-bezier(.3,1.6,.5,1)}
  .chips label:active{transform:scale(.97);transition-duration:.06s}
  .chips label.pop{animation:chipPop .38s cubic-bezier(.3,1.6,.5,1)}
  .mid input.bump{animation:bump .32s cubic-bezier(.3,1.6,.5,1)}
  /* 4. Cake: the first slice is cut open, later changes slice in over the old cake */
  .slice.reveal #cakeCanvas{animation:cutOpen .75s cubic-bezier(.65,0,.35,1) both}
  .slice.swap #cakeCanvas{animation:cutOpen .46s cubic-bezier(.65,0,.35,1) both}
  .slice.reveal::after,.slice.swap::after{content:"";position:absolute;z-index:2;top:-5%;bottom:-5%;left:0;width:3px;border-radius:2px;background:var(--accent);animation:knifeX .75s cubic-bezier(.65,0,.35,1) forwards}
  .slice.swap::after{animation-duration:.46s}
  .cheer.hop{animation:hop .5s cubic-bezier(.3,.7,.3,1) 2}
  .cheer.in{animation:cheerIn .45s cubic-bezier(.3,1.6,.5,1) both}
}
@keyframes knife{0%{left:-10px}100%{left:calc(100% + 10px);border-left-color:transparent}}
@keyframes knifeRev{0%{right:-10px}100%{right:calc(100% + 10px);border-right-color:transparent}}
@keyframes shiftIn{from{transform:translateX(8px)}to{transform:none}}
@keyframes shiftInRev{from{transform:translateX(-8px)}to{transform:none}}
@keyframes chipPop{0%{transform:scale(.95)}100%{transform:none}}
@keyframes bump{0%{transform:scale(1.2)}100%{transform:none}}
@keyframes cutOpen{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes knifeX{0%{left:0;opacity:1}85%{opacity:1}100%{left:100%;opacity:0}}
@keyframes hop{0%,100%{transform:none}45%{transform:translateY(-9px)}}
@keyframes cheerIn{from{transform:translateY(10px) scale(.6);opacity:0}to{transform:none;opacity:1}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

          <fieldset class="field wide">

<script>
/*KEK-START*/
/* Kek lapis Sarawak pattern generator, v2.
   Built the way bakers build them: bake coloured layer sheets, cut tiles from the sheets,
   rotate/mirror the tiles and glue them back together with jam lines, then wrap the block
   in plain layered cake.
   People choose the pattern and the colours. Every bake is still one of a kind.
   Code = 8 Crockford base32 characters, shown as XXXX-XXXX:
     character 1 = pattern, character 2 = colours, characters 3-8 = this bake (grid, layer widths, frames...).
   design(code) is a pure function of the code. After launch, never change the order or meaning of the
   random draws below, or everyone's saved cake changes. */
(function(){
'use strict';

/* ---------- seeded random ---------- */
function cyrb128(str){
  var h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (var i = 0, k; i < str.length; i++){
    k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067); h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213); h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067); h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213); h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  return [(h1 ^ h2 ^ h3 ^ h4) >>> 0, (h2 ^ h1) >>> 0, (h3 ^ h1) >>> 0, (h4 ^ h1) >>> 0];

    d = (d + 1) | 0; t = (t + d) | 0; c = (c + t) | 0;

var PALETTES = [
  {id:'klasik',    ms:'Klasik',          en:'Classic',        c:['#E0303F', '#1E9E57', '#F6C531']},
  {id:'seridewi',  ms:'Hijau Hitam',     en:'Green & black',  c:['#1E9E57', '#2B1A12', '#E0303F', '#F6C531']},
  {id:'ungumerah', ms:'Ungu Merah',      en:'Purple & red',   c:['#6C3BAA', '#E0303F', '#FFF1D0']},
  {id:'laut',      ms:'Laut',            en:'Sea',            c:['#18B2C9', '#F28C28', '#FFF1D0']},
  {id:'pelangi',   ms:'Pelangi',         en:'Rainbow',        c:['#F0508A', '#F6C531', '#3DB35A', '#2F6FD6']},
  {id:'pandan',    ms:'Pandan Coklat',   en:'Pandan & choc',  c:['#6DBE45', '#5A2E14', '#FFF1D0']},
  {id:'telang',    ms:'Bunga Telang',    en:'Butterfly pea',  c:['#3557C4', '#7B3FB5', '#FFFFFF', '#F6C531']},
  {id:'senja',     ms:'Senja',           en:'Sunset',         c:['#F28C28', '#F0508A', '#6C3BAA']},
  {id:'hutan',     ms:'Hutan',           en:'Rainforest',     c:['#1E9E57', '#9BCB3B', '#F6C531', '#5A2E14']},
  {id:'primer',    ms:'Primer',          en:'Primary',        c:['#E0303F', '#2F6FD6', '#F6C531']},
  {id:'gula',      ms:'Gula Melaka',     en:'Palm sugar',     c:['#8A4B23', '#FFF1D0', '#F28C28']},
  {id:'durian',    ms:'Durian',          en:'Durian',         c:['#C9D14A', '#1E9E57', '#FFF1D0']},
  {id:'strawberi', ms:'Strawberi Susu',  en:'Strawberry milk',c:['#F0508A', '#FFFFFF', '#E0303F']},
  {id:'raya',      ms:'Bunga Raya',      en:'Hibiscus',       c:['#E0303F', '#F0508A', '#1E9E57']},
  {id:'birukuning',ms:'Biru Kuning',     en:'Blue & yellow',  c:['#2F6FD6', '#F6C531', '#FFFFFF']},
  {id:'tehtarik',  ms:'Teh Tarik',       en:'Pulled tea',     c:['#C08A5A', '#F4E3C3', '#6B3A1C']}
];
/* tile kinds: D = bands by u+v (diagonal), L = by max(u,v) (squares), Q = by distance (circles),
   H/V = straight bands, T = half triangle, S = solid. "in" = tile corner points to block centre. */
var FAMILIES = [
  {id:'berlian',   ms:'Berlian',     en:'Diamond',       kind:'D', toward:'in',  reps:[1, 2]},
  {id:'anakpanah', ms:'Anak Panah',  en:'Chevron',       kind:'D', layout:'chevron', reps:[3, 5]},
  {id:'kotak',     ms:'Kotak',       en:'Nested squares',kind:'L', toward:'in',  reps:[1, 2]},
  {id:'papandam',  ms:'Papan Dam',   en:'Checkerboard',  kind:'S', layout:'checker'},
  {id:'tulangikan',ms:'Tulang Ikan', en:'Herringbone',   kind:'D', layout:'herring', reps:[3, 5]},
  {id:'anyaman',   ms:'Anyaman',     en:'Weave',         kind:'HV', layout:'weave', reps:[1, 2]},
  {id:'bintang',   ms:'Bintang',     en:'Star',          kind:'D', toward:'out', reps:[1, 2]},
  {id:'silang',    ms:'Silang',      en:'Cross',         kind:'L', toward:'out', reps:[1, 2]},
  {id:'kincir',    ms:'Kincir',      en:'Pinwheel',      kind:'T', layout:'pinwheel', reps:[1, 2]},
  {id:'bulat',     ms:'Mata Bulat',  en:'Rings',         kind:'Q', toward:'in',  reps:[2, 3]},
  {id:'kelopak',   ms:'Kelopak',     en:'Petals',        kind:'Q', toward:'out', reps:[1, 2]}
];
/* what people pick from: the 11 patterns, plus "Mix", which pairs two of them */
var PATTERNS = FAMILIES.concat([{id:'campur', ms:'Campur', en:'Mix', mix:true}]);
var BUTTER = '#F2D49B', LAYERLINE = 'rgba(122,72,34,0.50)', CRUST = '#C46F33', JAM = '#4E2610';

/* ---------- codes ---------- */
function rawOf(code){ return String(code || '').toUpperCase().replace(/[^0-9A-Z]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1').replace(/U/g, 'V'); }
function fmt(raw){ return raw.slice(0, 4) + '-' + raw.slice(4, 8); }
function valid(code){ var r = rawOf(code); if (r.length !== 8) return false; for (var i = 0; i < 8; i++) if (B32.indexOf(r[i]) < 0) return false; return true; }
function parts(code){ var r = rawOf(code); return {pattern: B32.indexOf(r[0]) % PATTERNS.length, palette: B32.indexOf(r[1]) % PALETTES.length, bake: r.slice(2)}; }
/* a brand-new cake: random pattern and colours unless given */
function newCode(opt){
  opt = opt || {};
  var p = opt.pattern != null ? opt.pattern : randIndex(PATTERNS.length);
  var c = opt.palette != null ? opt.palette : randIndex(PALETTES.length);
  return fmt(B32[p] + B32[c] + rand32(6));
}
function withPattern(code, i){ var r = rawOf(code); return fmt(B32[i] + r.slice(1)); }
function withPalette(code, i){ var r = rawOf(code); return fmt(r[0] + B32[i] + r.slice(2)); }
/* same pattern and colours, a new bake */
function rebake(code){ var r = rawOf(code); return fmt(r.slice(0, 2) + rand32(6)); }

/* ---------- a design from a code ---------- */
function design(code){
  var p = parts(code), s = cyrb128('lapis-makro:v2:' + p.bake), r = sfc32(s[0], s[1], s[2], s[3]);
  /* fixed list of draws, so changing only the pattern or the colours keeps the rest of the bake */
  var u = []; for (var i = 0; i < 32; i++) u.push(r());
  var pat = PATTERNS[p.pattern], pal = PALETTES[p.palette], fam = pat, mixWith = null;
  if (pat.mix){
    var a = Math.floor(u[0]*FAMILIES.length), b = Math.floor(u[1]*(FAMILIES.length - 1));
    if (b >= a) b++;
    fam = FAMILIES[a]; mixWith = FAMILIES[b];
  }
  var grid = u[2] < 0.3 ? 1 : (u[2] < 0.8 ? 2 : 3);
  if (mixWith && grid === 1) grid = 2;
  var cols = pal.c.slice();
  for (var k = cols.length - 1, j = 0; k > 0; k--, j++){ var q = Math.floor(u[3 + j]*(k + 1)), tmp = cols[k]; cols[k] = cols[q]; cols[q] = tmp; }
  function sheet(offset, at){
    var n = 3 + Math.floor(u[at]*3), bands = [];
    for (var m = 0; m < n; m++) bands.push({c: cols[(m + offset) % cols.length], w: 0.55 + u[at + 1 + m]*0.9});
    return bands;
  }
  var reps = fam.reps ? fam.reps[0] + Math.floor(u[18]*(fam.reps[1] - fam.reps[0] + 1)) : 1;
  return {
    code: fmt(rawOf(code)), pattern: pat, patternIndex: p.pattern, paletteIndex: p.palette,
    fam: fam, mixWith: mixWith, grid: grid, pal: pal, cols: cols,
    sheetA: sheet(0, 6), sheetB: sheet(1, 12), reps: reps,
    alt: u[19] < 0.6, jam: u[20] < 0.65, jamW: 1.2 + u[21]*1.4,
    frames: u[22] < 0.4 ? 0 : (u[22] < 0.8 ? 1 : 2),
    frameCols: [cols[Math.floor(u[23]*cols.length)], cols[Math.floor(u[24]*cols.length)]],
    border: 0.075 + u[25]*0.045, flip: u[26] < 0.5
  };
}

/* ---------- drawing ---------- */
function bandsOver(sheet, range, reps){
  var tot = 0; sheet.forEach(function(b){ tot += b.w; });
  var out = [], t = 0, unit = range/(reps*tot);
  for (var k = 0; k < reps; k++) sheet.forEach(function(b){ var w = b.w*unit; out.push({c: b.c, t0: t, t1: t + w}); t += w; });
  out[out.length - 1].t1 = range + 1;
  return out;
}
function region(x, kind, s, t){
  x.beginPath();
  if (kind === 'D'){
    if (t <= s){ x.moveTo(0, 0); x.lineTo(t, 0); x.lineTo(0, t); }
    else { var e = Math.min(t - s, s); x.moveTo(0, 0); x.lineTo(s, 0); x.lineTo(s, e); x.lineTo(e, s); x.lineTo(0, s); }
  } else if (kind === 'L'){ x.rect(0, 0, Math.min(t, s), Math.min(t, s)); }
  else if (kind === 'Q'){ x.moveTo(0, 0); x.arc(0, 0, t, 0, Math.PI/2); }
  else if (kind === 'H'){ x.rect(0, 0, s, Math.min(t, s)); }
  else if (kind === 'V'){ x.rect(0, 0, Math.min(t, s), s); }
  x.closePath();
}
function boundary(x, kind, s, t){
  x.beginPath();
  if (kind === 'D'){ if (t <= s){ x.moveTo(t, 0); x.lineTo(0, t); } else { x.moveTo(s, t - s); x.lineTo(t - s, s); } }
  else if (kind === 'L'){ x.moveTo(t, 0); x.lineTo(t, t); x.lineTo(0, t); }
  else if (kind === 'Q'){ x.arc(0, 0, t, 0, Math.PI/2); }
  else if (kind === 'H'){ x.moveTo(0, t); x.lineTo(s, t); }
  else if (kind === 'V'){ x.moveTo(t, 0); x.lineTo(t, s); }
  x.stroke();
}
var RANGE = {D: 2, L: 1, Q: Math.SQRT2, H: 1, V: 1};
function lum(hex){ var n = parseInt(hex.slice(1), 16); return 0.2126*((n >> 16) & 255) + 0.7152*((n >> 8) & 255) + 0.0722*(n & 255); }
function contrastPick(cols, against){ var best = cols[0], bd = -1; cols.forEach(function(c){ var dd = Math.abs(lum(c) - lum(against)); if (dd > bd){ bd = dd; best = c; } }); return best; }
function bandedTile(x, kind, sheet, s, reps, d, scale){
  var bands = bandsOver(sheet, RANGE[kind]*s, reps);
  for (var i = bands.length - 1; i >= 0; i--){ region(x, kind, s, bands[i].t1); x.fillStyle = bands[i].c; x.fill(); }
  if (d.jam){ x.strokeStyle = JAM; x.lineWidth = d.jamW*scale; for (var j = 1; j < bands.length; j++) boundary(x, kind, s, bands[j].t0); }

/* place a tile: corner = which corner of the tile holds the local origin (0 TL, 1 TR, 2 BR, 3 BL); rot = quarter turns */
function tile(x, X, Y, s, opt, draw){
  x.save(); x.beginPath(); x.rect(X, Y, s, s); x.clip();
  if (opt.rot != null){ x.translate(X + s/2, Y + s/2); x.rotate(opt.rot*Math.PI/2); x.translate(-s/2, -s/2); }
  else {
    var c = opt.corner || 0;
    x.translate(X + (c === 1 || c === 2 ? s : 0), Y + (c === 2 || c === 3 ? s : 0));
    x.scale(c === 1 || c === 2 ? -1 : 1, c === 2 || c === 3 ? -1 : 1);
  }
  draw(); x.restore();

var IN = [2, 3, 0, 1], OUT = [0, 1, 2, 3]; /* corner per tile TL, TR, BR, BL */

/* Sources (checked October 2026):
   Resting burn: Mifflin-St Jeor (1990). Activity levels: Malaysian RNI 2017 PAL 1.4 / 1.6 / 1.8 / 2.0 (same scale as FAO/WHO/UNU 2004).
   Cuts: Malaysian CPG Management of Obesity 2023 - eat 500-750 kcal/day less for 0.5-1 kg a week; low-calorie diets
   1,200-1,500 kcal (women) and 1,500-1,800 kcal (men), so the floors are the bottom of those ranges.
   Protein: 1.2 g/kg (Leidy 2015, weight loss; RNI 2017 1.0-1.5), 1.6 (Morton 2018), 2.0 (ISSN 2017, top of 1.4-2.0).
   Fat: 25 / 30 / 35% of energy (RNI 2017 25-30%, AMDR 20-35%). Carbs kept at 130 g or more where the day allows (IOM RDA).
   Portions (KKM): 1 cawan nasi = 2 senduk = 150 g = 200 kcal (about 45 g carbs); 1 sudu teh minyak = 5 g; chicken or fish
   portion 80-120 g (about 25 g protein). Roti canai + teh tarik = 420 kcal (KKM poster).
   Goal date: early end = weekly simulation, 7,700 kcal per kg, burn recalculated from the new weight each week.
   Late end adds the slowdown in Hall et al. (2011): the body burns less by about 14% of the calorie change. */
var ACT = {sit:1.4, light:1.6, active:1.8, very:2.0};
var LOSE = {gentle:0.10, steady:0.20, fast:0.25}, MAX_CUT = 750;
var GAIN = {gentle:0.05, steady:0.10, fast:0.15}, MAX_ADD = 500;
var PROT = {rare:1.2, some:1.6, lots:2.0};
var FATS = {carb:0.25, bal:0.30, fat:0.35};
var KCAL_PER_KG = 7700, ADAPT = 0.14, SET_KCAL = 420, PALM_G = 25, RICE_CUP_G = 45, OIL_TBSP_G = 15, MIN_CARB_G = 130;

function bmrOf(sex, w, h, a){ return 10*w + 6.25*h - 5*a + (sex === 'm' ? 5 : -161); }
function half(n){ return Math.round(n*2)/2; }
function r5(n){ return Math.round(n/5)*5; }
function r10(n){ return Math.round(n/10)*10; }

function suggestGoal(s){
  var h2 = Math.pow(s.height/100, 2);
  var bmi = Math.round(s.weight/h2*10)/10;
  if (bmi > 22.9) return Math.max(half(s.weight - 5), Math.ceil(22.9*h2*2)/2);
  if (bmi < 18.5) return Math.ceil(18.5*h2*2)/2;
  return s.weight;
}

function pctSplit(parts, tot){
  if (tot <= 0) return [0,0,0];
  var raw = parts.map(function(p){ return p/tot*100; });
  var fl = raw.map(Math.floor);
  var rest = 100 - fl.reduce(function(a,b){ return a+b; }, 0);
  var order = raw.map(function(v,i){ return [v - fl[i], i]; }).sort(function(a,b){ return b[0]-a[0]; });
  for (var k = 0; k < rest; k++) fl[order[k][1]]++;
  return fl;
}

function plan(s){
  var h2 = Math.pow(s.height/100, 2);
  var act = ACT[s.act] || 1.4;
  var bmr = bmrOf(s.sex, s.weight, s.height, s.age);
  var tdee = bmr*act;
  var bmi = Math.round(s.weight/h2*10)/10;
  var cat = bmi < 18.5 ? 'under' : (bmi <= 22.9 ? 'healthy' : 'above');
  var floor = s.sex === 'm' ? 1500 : 1200;
  var minHealthy = Math.ceil(18.5*h2*2)/2;

  var goal = (s.goal == null) ? suggestGoal(s) : s.goal;
  var goalClamped = false;
  if (goal < minHealthy && goal < s.weight){ goal = Math.min(minHealthy, s.weight); goalClamped = true; }
  var mode = goal < s.weight - 0.25 ? 'lose' : (goal > s.weight + 0.25 ? 'gain' : 'keep');
  if (cat === 'under' && goal <= s.weight){ mode = 'keep'; goal = s.weight; goalClamped = false; }

  function intakeAt(w){
    var t = bmrOf(s.sex, w, s.height, s.age)*act;
    if (mode === 'lose'){
      if (t <= floor) return {t:t, i:t, floorHit:false, noRoom:true};
      var raw = t - Math.min(t*LOSE[s.pace], MAX_CUT);
      if (raw < floor) return {t:t, i:floor, floorHit:true, noRoom:false};
      return {t:t, i:raw, floorHit:false, noRoom:false};
    }
    if (mode === 'gain') return {t:t, i:t + Math.min(t*GAIN[s.pace], MAX_ADD), floorHit:false, noRoom:false};
    return {t:t, i:t, floorHit:false, noRoom:false};
  }

  var now = intakeAt(s.weight);
  var target = now.i;
  var weekly = (target - tdee)*7/KCAL_PER_KG;

  /* weeks to goal; adapt = the body burning a little less (or, when gaining, a little more) than its weight predicts */
  function weeksTo(adapt){
    var shift = adapt ? ADAPT*Math.abs(target - tdee) : 0, w = s.weight, n = 0;
    while (n < 520){
      var x = intakeAt(w), burn = mode === 'lose' ? x.t - shift : x.t + shift;
      var dw = (x.i - burn)*7/KCAL_PER_KG;
      if (mode === 'lose' ? dw > -0.02 : dw < 0.02) return null;
      w += dw; n++;
      if (mode === 'lose' ? w <= goal : w >= goal) return n;
    }
    return null;
  }
  var weeks = null, weeksLate = null, slow = false;
  if (mode !== 'keep'){
    weeks = weeksTo(false);
    weeksLate = weeks == null ? null : weeksTo(true);
    slow = weeks == null;
  }

  var steady = null;
  if (tdee > floor) steady = Math.max(floor, tdee - Math.min(tdee*LOSE.steady, MAX_CUT));
  var steadyGain = tdee + Math.min(tdee*GAIN.steady, MAX_ADD);

  var ref = Math.min(mode === 'lose' ? goal : s.weight, 25*h2);
  var gkg = PROT[s.train] || 1.2;
  var protG = ref*gkg, protK = protG*4;
  var fatK = target*(FATS[s.style] || 0.30);
  var carbK = target - protK - fatK;
  if (carbK < MIN_CARB_G*4){
    var need = MIN_CARB_G*4 - carbK, room = Math.max(0, fatK - target*0.20), take = Math.min(need, room);
    fatK -= take; carbK += take;
  }
  if (carbK < 0) carbK = 0;
  var fatG = fatK/9, carbG = carbK/4;
  var pcts = pctSplit([protK, fatK, carbK], protK + fatK + carbK);
  var meals = s.meals || 3;
  var cut = Math.max(0, tdee - target);

  return {
    bmr:bmr, tdee:tdee, bmi:bmi, cat:cat, floor:floor, minHealthy:minHealthy,
    goal:goal, goalClamped:goalClamped, mode:mode, target:target,
    floorHit:now.floorHit, noRoom:now.noRoom, cut:cut, weekly:weekly, weeks:weeks, weeksLate:weeksLate, slow:slow,
    steady:steady, steadyGain:steadyGain, restPct:Math.round(bmr/tdee*100), ref:ref, gkg:gkg,
    protG:protG, fatG:fatG, carbG:carbG, pP:pcts[0], pF:pcts[1], pC:pcts[2],
    palms:half(protG/PALM_G), rice:half(carbG/RICE_CUP_G), oil:half(fatG/OIL_TBSP_G),
    sets:half(cut/SET_KCAL),
    meals:meals, mealProt:protG/meals, mealKcal:target/meals, mealPalms:half(protG/meals/PALM_G)
  };
}
/*CALC-END*/

var RANGE = {age:[18,80,1], height:[140,210,1], weight:[35,250,0.5], goal:[35,250,0.5]};
var ENUMS = {lang:['en','ms'], theme:['light','dark'], sex:['m','f'], pace:['gentle','steady','fast'], act:['sit','light','active','very'],
             train:['rare','some','lots'], style:['carb','bal','fat'], sleep:['u6','67','78','8p']};

function fresh(){ var s = {}; for (var k in DEF) s[k] = DEF[k]; return s; }
function sanitize(o){
  var s = fresh();
  if (!o || typeof o !== 'object') return s;
  Object.keys(ENUMS).forEach(function(k){ if (ENUMS[k].indexOf(o[k]) >= 0) s[k] = o[k]; });
  ['age','height','weight'].forEach(function(k){ var v = +o[k]; if (isFinite(v) && v >= RANGE[k][0] && v <= RANGE[k][1]) s[k] = v; });
  if (o.goal != null){ var g = +o.goal; if (isFinite(g) && g >= RANGE.goal[0] && g <= RANGE.goal[1]) s.goal = g; }
  if (o.goalAuto === false) s.goalAuto = false;

function wedgePath(a0, a1){
  var cx = PL.cx, cy = PL.cy, r = PL.well;
  if (a1 - a0 <= 0.0001) return '';
  if (a1 - a0 >= Math.PI*2 - 0.0001){
    return 'M' + cx + ' ' + (cy - r) + ' A' + r + ' ' + r + ' 0 1 1 ' + cx + ' ' + (cy + r) + ' A' + r + ' ' + r + ' 0 1 1 ' + cx + ' ' + (cy - r) + ' Z';
  }
  var x0 = cx + r*Math.sin(a0), y0 = cy - r*Math.cos(a0), x1 = cx + r*Math.sin(a1), y1 = cy - r*Math.cos(a1);
  return 'M' + cx + ' ' + cy + ' L' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + (a1 - a0 > Math.PI ? 1 : 0) + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' Z';
}
function drawPlate(svg, shares){
  var ws = svg.querySelectorAll('.w'), ls = svg.querySelectorAll('.wl'), a = 0;
  for (var i = 0; i < 3; i++){
    var span = Math.max(0, shares[i])/100*Math.PI*2;
    ws[i].setAttribute('d', wedgePath(a, a + span));
    var mid = a + span/2;
    if (shares[i] >= 9){
      ls[i].setAttribute('x', (PL.cx + PL.label*Math.sin(mid)).toFixed(1));
      ls[i].setAttribute('y', (PL.cy - PL.label*Math.cos(mid)).toFixed(1));
      ls[i].textContent = Math.round(shares[i]) + '%';
    } else {
      ls[i].textContent = '';
    }
    a += span;
  }
}
var plateFrom = [0,0,0], plateRaf = 0;
function animatePlate(svg, to){
  var from = plateFrom.slice();
  plateFrom = to.slice();
  if (plateRaf) cancelAnimationFrame(plateRaf);
  if (reduceMotion || (from[0] === to[0] && from[1] === to[1] && from[2] === to[2])){ drawPlate(svg, to); return; }
  var start = performance.now(), dur = 700;
  drawPlate(svg, from);
  function tick(now){
    var k = Math.min(1, (now - start)/dur), e = 1 - Math.pow(1 - k, 3);
    drawPlate(svg, from.map(function(v, i){ return v + (to[i] - v)*e; }));
    if (k < 1) plateRaf = requestAnimationFrame(tick); else plateRaf = 0;
  }
  plateRaf = requestAnimationFrame(tick);
}

function makeCard(){

  p: '<svg class="i-p" viewBox="0 0 56 56" aria-hidden="true"><g fill="currentColor"><rect x="13" y="9" width="6.6" height="30" rx="3.3"/><rect x="20.5" y="4" width="6.6" height="30" rx="3.3"/><rect x="28" y="4" width="6.6" height="30" rx="3.3"/><rect x="35.5" y="9" width="6.6" height="30" rx="3.3"/><rect x="12" y="24" width="31" height="28" rx="10"/><rect x="-3.6" y="-21" width="7.2" height="22" rx="3.6" transform="translate(14 40) rotate(-48.7)"/></g></svg>',
  c: '<svg class="i-c" viewBox="0 0 56 56" aria-hidden="true"><path d="M9 30A19 19 0 0 1 47 30Z" fill="var(--plate)" stroke="currentColor" stroke-width="3"/><g fill="currentColor"><ellipse cx="21" cy="20" rx="2.6" ry="1.5" transform="rotate(29 21 20)"/><ellipse cx="29" cy="15" rx="2.6" ry="1.5" transform="rotate(29 29 15)"/><ellipse cx="36" cy="21" rx="2.6" ry="1.5" transform="rotate(29 36 21)"/><ellipse cx="26" cy="26" rx="2.6" ry="1.5" transform="rotate(29 26 26)"/><path d="M4 29h48q-2 20-24 21q-22-1-24-21z"/><rect x="19" y="49" width="18" height="5" rx="2.5"/></g></svg>',
  f: '<svg class="i-f" viewBox="0 0 56 56" aria-hidden="true"><ellipse rx="11" ry="15" transform="translate(19 20) rotate(-44.7)" fill="currentColor"/><path d="M27 29L50 52" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><ellipse rx="5" ry="7.5" transform="translate(17 18) rotate(-44.7)" fill="#FFFFFF" opacity=".55"/></svg>'
};
function portionTxt(key, v){
  var d = T[S.lang] || T.ms, n = Math.max(0.5, Math.round(v*2)/2);
  return t((n <= 1 && (key + '_1') in d) ? key + '_1' : key, {n: halfTxt(v)});
}
function pItem(k, big, small){ return '<li>' + ICON[k] + '<div><b>' + esc(big) + '</b><small>' + esc(small) + '</small></div></li>'; }
function reward5(P){
  var m = P.meals, g = goalParts(P);
  var h = '<p class="r-label">' + esc(t('eachMeal', {n: m})) + '</p><ul class="portions">';
  h += pItem('p', portionTxt('palmN', P.protG/m/PALM_G), t('palmSub', {g: fmt(P.protG/m)}));
  h += pItem('c', portionTxt('riceN', P.carbG/m/RICE_CUP_G), t('riceSub', {g: fmt(P.carbG/m)}));
  h += pItem('f', portionTxt('oilN', P.fatG/m/OIL_TBSP_G), t('oilSub', {g: fmt(P.fatG/m)}));
  h += '</ul><dl class="rows">' + row(t('mealKcal'), t('mealKcalVal', {x: fmt(r10(P.mealKcal))})) + '</dl>';
  h += '<div class="day"><p class="day-h"><span>' + esc(t('dayLabel')) + '</span><b>' + fmt(r10(P.target)) + ' kcal</b></p>';
  h += '<div class="mbar" aria-hidden="true"><i class="d-p" style="flex-grow:' + P.pP + '"></i><i class="d-f" style="flex-grow:' + P.pF + '"></i><i class="d-c" style="flex-grow:' + P.pC + '"></i></div>';
  h += '<ul class="mleg"><li><span class="dot d-p" aria-hidden="true"></span>' + esc(t('mProtein')) + ' <b>' + fmt(r5(P.protG)) + ' g</b></li>' +
       '<li><span class="dot d-f" aria-hidden="true"></span>' + esc(t('mFat')) + ' <b>' + fmt(r5(P.fatG)) + ' g</b></li>' +
       '<li><span class="dot d-c" aria-hidden="true"></span>' + esc(t('mCarb')) + ' <b>' + fmt(r5(P.carbG)) + ' g</b></li></ul></div>';
  h += '<dl class="rows">' + row(t('goalRow'), P.mode === 'keep' ? t('goalKeep') : (g.when ? t('goalBy', {d: g.delta, w: g.when}) : g.delta)) + '</dl>';
  h += '<p class="fine">' + esc(t('portionNote')) + '</p>';
  return h;
}
var baking = false;
function drawCakeOn(cv, d){
  var dpr = Math.min(3, window.devicePixelRatio || 1), size = Math.round((cv.clientWidth || 300)*dpr);
  if (cv.width !== size){ cv.width = size; cv.height = size; }
  var x = cv.getContext('2d');
  x.clearRect(0, 0, size, size);
  KekLapis.drawSlice(x, 0, 0, size, d);
}
function playOnce(el, cls, ms){
  if (reduceMotion) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  clearTimeout(el['_' + cls]);
  el['_' + cls] = setTimeout(function(){ el.classList.remove(cls); }, ms);
}
/* mode: 'reveal' (first cut), 'swap' (new cake slices in over the old one) or nothing */
function renderCake(mode){
  if (!S.cake || baking) return;
  var d = KekLapis.design(S.cake), info = KekLapis.describe(d, S.lang), front = $('cakeCanvas'), back = $('cakeBack');
  if (mode === 'swap' && !reduceMotion){
    if (back.width !== front.width){ back.width = front.width; back.height = front.height; }
    var bx = back.getContext('2d'); bx.clearRect(0, 0, back.width, back.height); bx.drawImage(front, 0, 0);
  }
  drawCakeOn(front, d);
  if (mode) playOnce($('slice'), mode, mode === 'reveal' ? 820 : 520);
  front.setAttribute('aria-label', t('cakeAlt', {n: info.name, c: info.palette}));
  $('cakeName').textContent = info.name + ' · ' + info.palette;
  $('cakeCode').textContent = '#' + d.code;
  if (openStrip) markStrip();
}
/* The first time someone reaches the last page, their cake is baked layer by layer, then cut open */
function bakeCake(){
  if (reduceMotion){ renderCake(); return; }
  var d = KekLapis.design(S.cake), cols = d.cols, stack = $('ovenStack'), html = '';
  for (var i = 0; i < 9; i++) html += '<i style="background:' + (i % 2 ? '#F2D49B' : cols[(i >> 1) % cols.length]) + ';animation-delay:' + (i*95) + 'ms"></i>';
  stack.innerHTML = html;
  baking = true;
  $('slice').style.visibility = 'hidden'; $('cheer').classList.add('hide');
  $('oven').hidden = false; $('oven').classList.add('run');
  $('cakeName').textContent = t('baking'); $('cakeCode').textContent = '';
  setTimeout(function(){
    baking = false;
    $('oven').hidden = true; $('oven').classList.remove('run');
    $('slice').style.visibility = '';
    renderCake('reveal');
    var ch = $('cheer'); ch.classList.remove('hide');
    playOnce(ch, 'in', 500);
    setTimeout(function(){ playOnce(ch, 'hop', 1100); }, 520);
    $('live').textContent = $('cakeName').textContent;
  }, 1250);
}
var openStrip = null;
function toggleStrip(kind){
  openStrip = (openStrip === kind) ? null : kind;
  $('pickPattern').setAttribute('aria-expanded', String(openStrip === 'pattern'));
  $('pickColour').setAttribute('aria-expanded', String(openStrip === 'colour'));
  $('chooser').hidden = !openStrip;
  if (openStrip) renderStrip();
}
function renderStrip(){
  var kind = openStrip, list = kind === 'pattern' ? KekLapis.PATTERNS : KekLapis.PALETTES, strip = $('strip');
  var px = Math.round(68*Math.min(2, window.devicePixelRatio || 1));
  strip.setAttribute('aria-label', t(kind === 'pattern' ? 'patternList' : 'colourList'));
  strip.innerHTML = list.map(function(it, i){
    return '<button type="button" class="opt" aria-pressed="false" data-kind="' + kind + '" data-i="' + i + '"><canvas width="' + px + '" height="' + px + '" aria-hidden="true"></canvas><span>' + esc(it[S.lang] || it.ms) + '</span></button>';
  }).join('');
  Array.prototype.forEach.call(strip.querySelectorAll('canvas'), function(cv, i){
    var code = kind === 'pattern' ? KekLapis.withPattern(S.cake, i) : KekLapis.withPalette(S.cake, i);
    KekLapis.drawSlice(cv.getContext('2d'), 0, 0, px, KekLapis.design(code));
  });
  markStrip();
}
function markStrip(){
  var cur = KekLapis.parts(S.cake), sel = openStrip === 'pattern' ? cur.pattern : cur.palette;
  Array.prototype.forEach.call($('strip').querySelectorAll('.opt'), function(b){ b.setAttribute('aria-pressed', String(+b.getAttribute('data-i') === sel)); });
}
function setCake(code, redrawStrip){
  S.cake = code; save();
  renderCake('swap');
  if (redrawStrip && openStrip) renderStrip();
  if (redrawStrip) playOnce($('cheer'), 'hop', 1100);
  $('live').textContent = $('cakeName').textContent;
  queueCard();
}

/* Saving: Claude viewer capability, then the phone share sheet, then a normal download, then long-press */
var downloadsNS = null;
var inViewer = !!(window.claude && typeof window.claude.use === 'function');
if (inViewer){
  try { window.claude.use('downloads').then(function(ns){ downloadsNS = ns; }, function(){ downloadsNS = null; }); } catch (e) {}
}
function doSave(btn){
  if (!cardBlob){ setStatus(t('saving')); makeCard().then(function(){ if (cardBlob) doSave(btn); }); return; }
  setStatus('');
  if (downloadsNS){
    downloadsNS.save({filename: cardFile(), data: cardBlob}).then(function(){ setStatus(t('savedOk')); }, function(err){
      var code = err && err.code;
      if (code === 'declined') return;
      if (code === 'rate_limited') return;
      setStatus(t('longPress'), true);
    });
    return;
  }
  if (inViewer){ setStatus(t('longPress'), true); return; }
  var file = null;
  try { file = new File([cardBlob], cardFile(), {type: 'image/png'}); } catch (e) { file = null; }
  var coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  if (file && coarse && navigator.canShare && navigator.share){
    var ok = false;
    try { ok = navigator.canShare({files: [file]}); } catch (e) { ok = false; }
    if (ok){
      navigator.share({files: [file], title: 'Lapis Makro'}).then(function(){ setStatus(t('sharedOk')); }, function(err){
        if (err && err.name === 'AbortError') return;
        downloadFile();
      });
      return;
    }
  }
  downloadFile();
}
function downloadFile(){
  try {
    var a = document.createElement('a');
    a.href = cardURL; a.download = cardFile(); a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setStatus(t('downloaded'));
  } catch (e) { setStatus(t('longPress'), true); }
}

/* ---------- Count-up for the big numbers ---------- */
var lastVal = {}, rafs = {};
function runCounters(root){
  var els = root.querySelectorAll('.cnt');
  Array.prototype.forEach.call(els, function(el){
    var key = el.getAttribute('data-key'), to = +el.getAttribute('data-to'), from = lastVal[key];
    lastVal[key] = to;
    if (reduceMotion || from == null || from === to){ el.textContent = fmt(to); return; }
    if (rafs[key]) cancelAnimationFrame(rafs[key]);
    var start = performance.now(), dur = 380;
    el.textContent = fmt(from);
    function tick(now){
      var k = Math.min(1, (now - start)/dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(from + (to - from)*e);
      if (k < 1) rafs[key] = requestAnimationFrame(tick);
    }
    rafs[key] = requestAnimationFrame(tick);
  });
}

/* ---------- Render ---------- */
var announceTimer = null;
function update(){
  save();
  var P = plan(S);
  renderStack(P);
  var fns = [null, reward1, reward2, reward3, reward4, reward5];
  var r = $('r' + S.step);
  if (r && fns[S.step]){
    r.innerHTML = fns[S.step](P);
    runCounters(r);
    var svg = r.querySelector('.plate');
    if (svg) animatePlate(svg, [P.pP, P.pF, P.pC]);
  }
  if (S.step === 5){ renderCake(); queueCard(); }
  $('pvBtn').textContent = t($('cardPreview').classList.contains('open') ? 'previewClose' : 'previewOpen');
  $('exampleBadge').hidden = !S.example;
  $('goalHint').hidden = !S.goalAuto;
  clearTimeout(announceTimer);
  announceTimer = setTimeout(function(){
    if (!r) return;
    var lab = r.querySelector('.r-label'), big = r.querySelector('.big');
    if (lab && big) $('live').textContent = lab.textContent + ' ' + big.textContent;
  }, 900);
}

function go(n, viaNext){
  if (n < 1 || n > 5) return;
  if (n > S.maxStep && !(viaNext && n === S.maxStep + 1)) return;
  var isNew = n > S.maxStep, from = S.step;
  if (n >= 2 && S.goal == null){ S.goal = suggestGoal(S); S.goalAuto = true; }
  var firstCake = (n === 5 && !S.cake);
  if (firstCake) S.cake = KekLapis.newCode();
  S.maxStep = Math.max(S.maxStep, n);
  S.step = n;
  setPanel(false);
  for (var i = 1; i <= 5; i++) $('s' + i).hidden = (i !== n);
  $('confirmRow').hidden = true;
  setStatus('');
  if (n !== 3) plateFrom = [0,0,0];
  syncInputs(true);
  update();
  if (isNew && n <= 4){
    var b = $('band-' + n), seg = document.querySelectorAll('.psegs i')[n-1];
    [b, seg].forEach(function(el){ playOnce(el, 'fresh', 700); });
  }
  if (isNew && n === 5) playOnce($('toLabel'), 'fresh', 700);
  if (from !== n){
    var secEl = $('s' + n);
    secEl.classList.toggle('rev', n < from);
    playOnce(secEl, 'enter', 560);
  }
  if (firstCake) bakeCake();
  var sec = $('s' + n);
  var offset = isPhone() ? $('progress').offsetHeight + 12 : 16;
  var y = sec.getBoundingClientRect().top + window.pageYOffset - offset;
  try { window.scrollTo({top: Math.max(0, y), behavior: reduceMotion ? 'auto' : 'smooth'}); } catch (e) { window.scrollTo(0, Math.max(0, y)); }
  var h = $('s' + n + '-h');
  if (h) try { h.focus({preventScroll: true}); } catch (e) { h.focus(); }
}

/* ---------- Inputs ---------- */
function showErr(k, msg){ var e = $(k + '-err'); e.textContent = msg; e.hidden = false; }
function setVal(k, v){
  S[k] = v; S.example = false;
  if (k === 'goal') S.goalAuto = false;
  else if (S.goalAuto && S.goal != null && (k === 'weight' || k === 'height')){ S.goal = suggestGoal(S); syncInputs(); }
  update();
}
function onNum(el){
  var k = el.id, R = RANGE[k];
  var raw = String(el.value).trim().replace(',', '.');
  var v = parseFloat(raw);
  if (raw === '' || !isFinite(v)) return showErr(k, t('errRange', {min: R[0], max: R[1]}));
  if (k === 'age' && v < 18) return showErr(k, t('errAdult'));
  if (v < R[0] || v > R[1]) return showErr(k, t('errRange', {min: R[0], max: R[1]}));
  $(k + '-err').hidden = true;
  v = (k === 'age' || k === 'height') ? Math.round(v) : Math.round(v*10)/10;
  setVal(k, v);
}
function stepBtn(btn){
  var k = btn.getAttribute('data-field'), dir = +btn.getAttribute('data-dir'), R = RANGE[k];
  var cur = (k === 'goal') ? goalValue() : S[k];
  var v = Math.min(R[1], Math.max(R[0], Math.round((cur + dir*R[2])*10)/10));
  $(k).value = (k === 'weight' || k === 'goal') ? fmt1(v) : String(v);
  $(k + '-err').hidden = true;
  playOnce($(k), 'bump', 360);
  setVal(k, v);
}

document.addEventListener('input', function(e){
  if (e.target.matches && e.target.matches('.mid input')) onNum(e.target);
});
document.addEventListener('focusout', function(e){
  var el = e.target;
  if (el.matches && el.matches('.mid input')){
    var err = $(el.id + '-err');
    if (err && !err.hidden){ err.hidden = true; syncInputs(true); }
  }
});
document.addEventListener('change', function(e){
  var el = e.target;
  if (el.type === 'radio' && el.checked){
    S[el.name] = (el.name === 'meals') ? +el.value : el.value;
    var lab = document.querySelector('label[for="' + el.id + '"]');
    if (lab) playOnce(lab, 'pop', 420);
    S.example = false;
    update();
  }
});
document.addEventListener('click', function(e){
  var prog = $('progress');
  if (prog.classList.contains('open') && !prog.contains(e.target)) setPanel(false);
  var el = e.target.closest ? e.target.closest('button') : null;
  if (!el) return;
  if (el.id === 'pbarBtn'){ setPanel(!prog.classList.contains('open')); return; }
  if (el.id === 'themeBtn'){
    S.theme = effectiveTheme() === 'dark' ? 'light' : 'dark';
    applyTheme(); save();
    return;
  }
  if (el.hasAttribute('data-lang')){
    S.lang = el.getAttribute('data-lang');
    applyStatic(); update();
    if (S.step === 5 && openStrip) renderStrip();
    return;
  }
  if (el.classList.contains('step-btn')){ stepBtn(el); return; }
  if (el.hasAttribute('data-go')){ go(+el.getAttribute('data-go'), el.hasAttribute('data-next')); return; }
  if (el.id === 'saveBtn'){ doSave(el); return; }
  if (el.id === 'pvBtn'){ setPreview(!$('cardPreview').classList.contains('open')); return; }
  if (el.id === 'pickPattern'){ toggleStrip('pattern'); return; }
  if (el.id === 'pickColour'){ toggleStrip('colour'); return; }
  if (el.id === 'rebake'){ setCake(KekLapis.rebake(S.cake), true); return; }
  if (el.classList.contains('opt')){ var oi = +el.getAttribute('data-i'); setCake(el.getAttribute('data-kind') === 'pattern' ? KekLapis.withPattern(S.cake, oi) : KekLapis.withPalette(S.cake, oi), false); return; }
  if (el.id === 'restartBtn'){ $('confirmRow').hidden = false; $('confirmNo').focus(); return; }
  if (el.id === 'confirmNo'){ $('confirmRow').hidden = true; $('restartBtn').focus(); return; }
  if (el.id === 'confirmYes'){
    var lang = S.lang, theme = S.theme, cake = S.cake;
    S = fresh(); S.lang = lang; S.theme = theme; S.cake = cake;
    lastVal = {}; plateFrom = [0,0,0];
    ['age','height','weight','goal'].forEach(function(k){ var er = $(k + '-err'); if (er) er.hidden = true; });
    applyStatic(); go(1);
    return;
  }
});
document.addEventListener('focusin', function(e){
  var el = e.target;
  if (el.matches && el.matches('.mid input')){
    setTimeout(function(){
      if (document.activeElement !== el) return;
      try { el.setSelectionRange(0, el.value.length); } catch (err) { try { el.select(); } catch (err2) {} }
    }, 0);
  }
});
var NEXT_FIELD = {age: 'height', height: 'weight'};
document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.mid input')){
    e.preventDefault();
    var nx = NEXT_FIELD[e.target.id] && $(NEXT_FIELD[e.target.id]);
    if (nx) nx.focus(); else e.target.blur();
  }
  if (e.key === 'Escape' && $('progress').classList.contains('open')){ setPanel(false); $('pbarBtn').focus(); }
});

/* Shrink the phone bar once the page scrolls under it. Two thresholds 40px apart, so the bar's own
   height change (about 16px) can never flip it back and forth. */
var stuck = false, scrollTick = false;
function sentinelY(){ return $('sentinel').getBoundingClientRect().top + window.pageYOffset; }
function checkStuck(){
  scrollTick = false;
  var y = window.pageYOffset, s = sentinelY();
  if (!stuck && y > s + 40){ stuck = true; $('progress').classList.add('stuck'); }
  else if (stuck && y < s){ stuck = false; $('progress').classList.remove('stuck'); }
}
window.addEventListener('scroll', function(){ if (!scrollTick){ scrollTick = true; requestAnimationFrame(checkStuck); } }, {passive: true});

/* ---------- Boot ---------- */
applyStatic();
syncInputs(true);
for (var i = 1; i <= 5; i++) $('s' + i).hidden = (i !== S.step);
update();
var resizeTimer = 0;
window.addEventListener('resize', function(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(function(){ if (S.step === 5) renderCake(); }, 200); });
})();
</script>
